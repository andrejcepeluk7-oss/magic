<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Гримуар: Магический Конструктор</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: "Comic Sans MS", "Comic Sans", cursive; background: #1a1b1e; color: #e8eaed; margin: 0; padding: 10px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 12px; }
    .rune-group { display: flex; flex-direction: column; gap: 5px; background: #25262b; padding: 8px; border-radius: 14px; border: 1px solid #3c4043; }
    select, .fixed-rune, input { font-family: "Comic Sans MS", cursive; padding: 12px; border-radius: 10px; border: 1px solid #3c4043; background: #303134; color: white; font-size: 16px; width: 100%; outline: none; -webkit-appearance: none; }
    .fixed-rune { background: #1a1b1e; border: 1px solid #4a4d52; text-align: center; }
    .sub-input { background: #202124; font-size: 13px; display: none; }
    .result-box { padding: 10px; background: #2d2f33; border-radius: 14px; border: 2px dashed #4a4d52; }
    .btn-row { display: flex; gap: 10px; }
    .save-btn { flex: 1; padding: 16px; border: none; border-radius: 12px; background: #3a3d42; color: white; font-weight: bold; cursor: pointer; }
    .trash-btn { background: #303134; border: none; border-radius: 12px; font-size: 24px; cursor: pointer; padding: 0 15px; }
    details { background: #202124; border-radius: 14px; border: 1px solid #3c4043; }
    summary { padding: 14px; cursor: pointer; font-weight: bold; text-align: center; color: #9aa0a6; text-transform: uppercase; font-size: 13px; }
    .spell-item { padding: 12px; border-bottom: 1px solid #3c4043; font-size: 15px; }
    .info-content { padding: 15px; border-top: 1px solid #3c4043; font-size: 14px; }
    .info-content div { margin-bottom: 8px; border-bottom: 1px solid #2d2f33; padding-bottom: 4px; }
</style>
</head>
<body>

<div class="container">
    <div class="rune-group"><select id="s1" class="rune-sel" onchange="checkAccess(this); toggleSub(this, 'sub1');"></select><input type="text" id="sub1" class="sub-input" placeholder="Суть истока..."></div>
    <div class="rune-group"><div class="fixed-rune">ФОРМА</div><input type="text" id="sub_f" class="sub-input" style="display:block" placeholder="Описание формы..."></div>
    <div class="rune-group"><select id="s3" class="rune-sel" onchange="checkAccess(this); toggleSub(this, 'sub3');"></select><input type="text" id="sub3" class="sub-input" placeholder="Свойство..."></div>
    <div class="rune-group"><select id="s4" class="rune-sel" onchange="checkAccess(this); toggleSub(this, 'sub4');"></select><input type="text" id="sub4" class="sub-input" placeholder="Свойство..."></div>
    <div class="rune-group"><select id="s5" class="rune-sel" onchange="checkAccess(this); toggleSub(this, 'sub5');"></select><input type="text" id="sub5" class="sub-input" placeholder="Свойство..."></div>

    <div class="result-box"><input type="text" id="nameInput" placeholder="Название заклинания..."></div>
    <div class="btn-row"><button class="save-btn" onclick="saveToGrimoire()">Записать</button><button class="trash-btn" onclick="clearData()">🗑️</button></div>

    <details><summary>Гримуар</summary><div id="list"></div></details>

    <details>
        <summary>Справочник основ</summary>
        <div class="info-content">
            <div><strong>Форма:</strong> структура и вид заклинания.</div>
            <div><strong>Движение:</strong> вектор и путь перемещения.</div>
            <div><strong>Мощность:</strong> сила воздействия.</div>
            <div><strong>Температура:</strong> тепловые свойства.</div>
            <div><strong>Состояние:</strong> твердое, жидкое или газ.</div>
            <div><strong>Создание:</strong> катализатор воплощения.</div>
            <div><strong>Стихия:</strong> универсальный комбинатор.</div>
        </div>
    </details>
</div>

<script>
const UNLOCK_CODE = "1337";
let unlockedRunes = JSON.parse(localStorage.getItem('unlockedRunes') || '[]');
let grimoire = JSON.parse(localStorage.getItem('grimoire') || '[]');

const groups = {
    "Руны основ": ["движение", "прочность", "температура", "расширение", "сжатие", "время", "состояние", "именная руна", "создание", "событие", "рост", "стихия"],
    "Простые руны": ["огонь", "вода", "воздух", "земля", "металл", "яд", "молния", "некромантия", "восстановление тканей", "природа", "иллюзия", "слизь", "грибы", "материя магии", "взрыв"],
    "Мощные руны": ["смерть", "кровь", "золото", "пространство", "пустота", "жизнь", "свет", "тьма", "гравитация"]
};

const freeRunes = ["огонь", "вода", "воздух", "земля", "металл", "яд", "молния", "движение", "температура", "состояние", "создание", "стихия"];

function fillOptions() {
    document.querySelectorAll('.rune-sel').forEach(sel => {
        let current = sel.value;
        let html = `<option value="">Выберите руну</option>`;
        
        for (let g in groups) {
            html += `<optgroup label="${g}">`;
            let free = groups[g].filter(r => freeRunes.includes(r) || unlockedRunes.includes(r)).sort();
            let locked = groups[g].filter(r => !freeRunes.includes(r) && !unlockedRunes.includes(r)).sort();
            
            free.forEach(r => html += `<option value="${r}">${r}</option>`);
            locked.forEach(r => html += `<option value="${r}" style="color:gray">${r} 🔒</option>`);
            
            html += `</optgroup>`;
        }
        sel.innerHTML = html;
        sel.value = current;
    });
}

function checkAccess(sel) {
    if (!freeRunes.includes(sel.value) && !unlockedRunes.includes(sel.value) && sel.value !== "") {
        const pass = prompt("Введите код разблокировки:");
        if (pass === UNLOCK_CODE) {
            unlockedRunes.push(sel.value);
            localStorage.setItem('unlockedRunes', JSON.stringify(unlockedRunes));
            fillOptions();
            alert("Руна разблокирована!");
        } else { sel.value = ""; }
    }
}

function toggleSub(sel, subId) { document.getElementById(subId).style.display = sel.value ? "block" : "none"; }

function saveToGrimoire() {
    const name = document.getElementById('nameInput').value || "Без названия";
    grimoire.push(name);
    localStorage.setItem('grimoire', JSON.stringify(grimoire));
    renderGrimoire();
}

function renderGrimoire() {
    document.getElementById('list').innerHTML = grimoire.map(s => `<div class="spell-item">✨ ${s}</div>`).join('');
}

function clearData() {
    if (confirm("Вы уверены, что хотите очистить всё?")) {
        localStorage.clear();
        location.reload();
    }
}

fillOptions();
renderGrimoire();
</script>
</body>
</html>
